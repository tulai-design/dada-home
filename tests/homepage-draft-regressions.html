<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>首页草稿回归</title>
  <body>
    <div id="root"></div>
    <script>
      // This fixture uses the real workspace store. Keep every storage operation in this
      // document's memory before its modules load, including Object.entries(localStorage).
      (() => {
        const values = new Map()
        const methods = {
          getItem: (key) => values.get(String(key)) ?? null,
          setItem: (key, value) => {values.set(String(key), String(value))},
          removeItem: (key) => {values.delete(String(key))},
          clear: () => values.clear(),
          key: (index) => [...values.keys()][Number(index)] ?? null,
          get length() {return values.size},
        }
        const storage = new Proxy(Object.create(null), {
          get: (_, key) => Object.hasOwn(methods, key) ? methods[key] : values.get(key),
          set: (_, key, value) => {values.set(String(key), String(value)); return true},
          deleteProperty: (_, key) => {values.delete(String(key)); return true},
          has: (_, key) => Object.hasOwn(methods, key) || values.has(key),
          ownKeys: () => [...values.keys()],
          getOwnPropertyDescriptor: (_, key) => values.has(key)
            ? {value: values.get(key), writable: true, enumerable: true, configurable: true}
            : undefined,
        })
        Object.defineProperty(window, 'localStorage', {value: storage, configurable: false})
      })()
    </script>
    <script type="module" src="./homepage-draft-regressions.tsx"></script>
  </body>
</html>
