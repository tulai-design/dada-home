# Bound the public read-only proxy separately from static asset requests.
limit_req_zone $binary_remote_addr zone=data_proxy:10m rate=300r/m;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /healthz {
    access_log off;
    proxy_pass http://127.0.0.1:8787/healthz;
    proxy_connect_timeout 1s;
    proxy_read_timeout 2s;
  }

  # API paths must never fall through to index.html, including proxy failures.
  location = /__proxy {
    # Feed URLs can carry private subscription tokens in the query string.
    access_log off;
    limit_req zone=data_proxy burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $http_host;
    proxy_set_header Cookie "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 20s;
    proxy_intercept_errors off;
    error_page 429 = @proxy_limited;
    error_page 502 503 504 = @proxy_unavailable;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
  }
  location @proxy_limited {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    return 429 '{"error":"取数请求较多，请稍后重试。"}';
  }
  location @proxy_unavailable {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    return 502 '{"error":"站点取数代理暂时不可用，请稍后重试。"}';
  }
  location /__proxy/ {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 404 '{"error":"没有这个代理接口。"}';
  }

  # 带哈希的构建产物，可以放心长期缓存
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # 运行时配置和入口页每次都要拿最新的
  location = /privacy {
    return 301 /privacy.html;
  }
  location = /config.js {
    add_header Cache-Control "no-store";
  }
  # service worker 和 manifest 必须每次都问一下，否则新版本永远推不下去
  location = /sw.js {
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/";
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    default_type application/manifest+json;
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
