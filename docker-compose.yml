# 部署示例：docker compose up -d，然后用反向代理（Caddy / Nginx / Traefik）指向 8080 并加上 HTTPS。
services:
  dada-home:
    image: ghcr.io/tulai-design/dada-home:latest
    container_name: dada-home
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      # 可选：Umami 访问统计。不填就不加载任何统计代码。
      UMAMI_WEBSITE_ID: ""
      # UMAMI_SRC: https://umami.example.com/script.js
      # UMAMI_DOMAINS: home.example.com
